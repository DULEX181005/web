<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontak BEM</title>
<link rel="stylesheet" href="/css/kontak.css">
</head>
<body>


<header>
    <h1>Kontak BEM</h1>
    <p>BEM STMIK Kota Tidore Kepulauan</p>
</header>

<div class="container">

    <div class="card">
        <h2>Informasi Kontak</h2>

        <div class="info">
            <strong>Alamat:</strong><br>
            STMIK Kota Tidore Kepulauan, Maluku Utara
        </div>

        <div class="info">
            <strong>Email:</strong><br>
            bem@stmiktidore.ac.id
        </div>

        <div class="info">
            <strong>Telepon:</strong><br>
            +62 812-3456-7890
        </div>

        <div class="info">
            <strong>Instagram:</strong><br>
            @bem_stmik_tidore
        </div>
    </div>

    <div class="card">
        <h2>Kirim Pesan</h2>

        <form id="formKontak">

            <input type="text" id="nama" placeholder="Nama Lengkap" required>

            <input type="email" id="email" placeholder="Email" required>

            <textarea id="pesan" placeholder="Tulis pesan..." required></textarea>

            <button type="submit">Kirim Pesan</button>

        </form>
    </div>

</div>

<footer>
    <p>&copy; 2026 BEM STMIK Kota Tidore Kepulauan</p>
</footer>

<script>
document.getElementById("formKontak")
.addEventListener("submit", function(e){

    e.preventDefault();

    let nama = document.getElementById("nama").value;

    alert("Terima kasih, " + nama + ". Pesan Anda berhasil dikirim!");

    document.getElementById("formKontak").reset();

});
</script>

</body>
</html>
